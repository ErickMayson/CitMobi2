spring.application.name=CitMobiTest

# Disable flyway during automated test context execution
spring.flyway.enabled=false

# In-memory H2 DB with PostgreSQL compatibility mode and IBGE schema
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS ibge
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

api.secret=test-secret-key-for-citmobi-testing-purposes-123456
