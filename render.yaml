services:
  - type: web
    name: citmobi-backend
    runtime: docker
    plan: free
    branch: deploy
    dockerfilePath: Dockerfile
    healthCheckPath: /citmobi/v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: citmobi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SERVER_SERVLET_CONTEXT_PATH
        value: /citmobi

databases:
  - name: citmobi-db
    plan: free
    databaseName: dbmobi
    user: postgres
